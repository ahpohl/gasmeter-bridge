meter:
  device: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0LNNZ6-if00-port0
  preset: sd_type
  #baud: 9600
  #data_bits: 8
  #stop_bits: 1
  #parity: none   # none | even | odd
  level:
    low: 700
    high: 950
  raw_mode: false
  gas:
    volume: 5356.38
    reset: false

mqtt:
  broker: localhost
  port: 1883
  topic: gasmeter-bridge
  #user: mqtt
  #password: "your secret password"
  queue_size: 100
  reconnect_delay:
    min: 2
    max: 64
    exponential: true

logger:
  level: info     # global default: off | error | warn | info | debug | trace
  modules:
    main: info
    meter: info
    mqtt: info